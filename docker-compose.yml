version: '3.8'

services:
  delivery-window-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - VENUE_SERVICE_URL=http://external-services-mock:8080/venue-service
      - COURIER_SERVICE_URL=http://external-services-mock:8080/courier-service
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CACHE_TTL_SECONDS=300
    depends_on:
      external-services-mock:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - app-network

  external-services-mock:
    image: wiremock/wiremock:3.2.0
    ports:
      - "8081:8080"
    volumes:
      - ./external-services-mock/mappings:/home/wiremock/mappings:ro
    networks:
      - app-network

  redis:
    image: redis:7.2-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network

volumes:
  redis_data:

networks:
  app-network:
    driver: bridge